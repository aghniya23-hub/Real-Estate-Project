
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Simulasi KPR - Rumah Jelas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg" id="mainNavbar">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Rumah Jelas</a>
  </div>
</nav>

<main class="py-5">
  <div class="container">
    <h3>Simulasi KPR</h3>
    <div class="row">
      <div class="col-md-6">
        <div class="card p-3">
          <div class="mb-3">
            <label class="form-label">Harga Rumah (Rp)</label>
            <input id="harga" class="form-control" value="450000000">
          </div>
          <div class="mb-3">
            <label class="form-label">DP (Rp)</label>
            <input id="dp" class="form-control" value="45000000">
          </div>
          <div class="mb-3">
            <label class="form-label">Bunga (% per tahun)</label>
            <input id="bunga" class="form-control" value="7.5">
          </div>
          <div class="mb-3">
            <label class="form-label">Tenor (tahun)</label>
            <input id="tenor" class="form-control" value="15">
          </div>
          <button class="btn btn-primary" id="hitungBtn">Hitung</button>
          <button class="btn btn-outline-secondary" id="saveSim">Simpan</button>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card p-3">
          <h5>Hasil</h5>
          <div id="hasil">Belum dihitung</div>
          <div id="amort" class="mt-3"></div>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <h5>Riwayat Simulasi</h5>
      <div id="simHistory"></div>
    </div>
  </div>
</main>

<script src="js/kpr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
