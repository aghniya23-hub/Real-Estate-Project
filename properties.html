<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daftar Properti — Rumah Jelas</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0f1720;
      --muted: #6b7280;
      --primary: #1A4D2E;
      --accent: #94BFA7;
    }
    [data-theme="dark"]{
      --bg: #071019;
      --card: #071827;
      --text: #e6f0f0;
      --muted: #9aa6ad;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;padding:0;}
    .container-wide{max-width:1200px}
    /* NAV */
    .navbar{background:transparent;padding: .8rem 0}
    .navbar .navbar-brand{font-weight:700}
    /* FILTER BAR */
    .filter-card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 6px 24px rgba(12,20,30,0.06);position:sticky;top:18px}
    .filter-row .form-control,.filter-row .form-select{height:44px}
    /* featured horizontal */
    .featured{
      background:var(--card);
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(12,20,30,0.06);
      display:flex;
      gap:0;
      margin-bottom:24px;
    }
    .featured .left{flex:0 0 48%}
    .featured .right{flex:1;padding:20px;display:flex;flex-direction:column}
    .featured img{width:100%;height:100%;object-fit:cover;display:block}
    .badge-verified{background:linear-gradient(90deg,var(--primary),var(--accent));color:#fff;padding:6px 10px;border-radius:8px;font-weight:600;font-size:12px}
    /* property grid */
    .property-card{border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 6px 18px rgba(12,20,30,0.06);transition:transform .22s ease,box-shadow .22s ease;height:100%;display:flex;flex-direction:column}
    .property-card:hover{transform:translateY(-8px);box-shadow:0 18px 40px rgba(12,20,30,0.12)}
    .property-card img{width:100%;height:170px;object-fit:cover}
    .property-card .card-body{padding:14px;flex:1}
    .price{color:var(--primary);font-weight:700}
    .meta{font-size:13px;color:var(--muted)}
    .btn-wishlist{border-radius:8px}
    /* responsive */
    @media (max-width:991px){
      .featured{flex-direction:column}
      .featured .left{flex-basis:auto}
      .featured img{height:260px}
      .filter-card{position:static;margin-bottom:18px}
    }
    @media (max-width:576px){
      .property-card img{height:150px}
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
    <div class="container container-wide">
      <a class="navbar-brand" href="index.html">Rumah Jelas</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item me-2"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item me-2"><a class="nav-link active" href="properties.html">Properti</a></li>
          <li class="nav-item me-2"><a class="nav-link" href="kpr.html">Simulasi KPR</a></li>
          <li class="nav-item me-2"><a class="nav-link" href="wishlist.html">Wishlist</a></li>
          <li class="nav-item me-3"><a class="nav-link" href="about.html">Tentang</a></li>
          <li class="nav-item"><button id="themeToggle" class="btn btn-outline-secondary btn-sm">Dark</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="py-4">
    <div class="container container-wide">
      <div class="row g-4">
        <!-- LEFT: content -->
        <div class="col-lg-8">
          <!-- Featured (horizontal) -->
          <div id="featuredContainer" class="featured mb-3">
            <!-- rendered by JS -->
          </div>

          <!-- Grid list -->
          <div class="row g-4" id="gridList">
            <!-- cards rendered by JS -->
          </div>

          <!-- empty / no result -->
          <div id="noResult" class="mt-4" style="display:none;">
            <div class="alert alert-warning">Tidak ada properti ditemukan untuk filter terpilih.</div>
          </div>
        </div>

        <!-- RIGHT: filter sidebar -->
        <div class="col-lg-4">
          <div class="filter-card">
            <h6 class="mb-3">Filter Pencarian</h6>

            <div class="mb-3">
              <label class="form-label small">Cari</label>
              <input id="searchInput" type="search" class="form-control" placeholder="Nama / lokasi ...">
            </div>

            <div class="mb-3">
              <label class="form-label small">Harga (Rp)</label>
              <div class="d-flex gap-2">
                <input id="priceMin" type="number" class="form-control" placeholder="Min" min="0" value="0">
                <input id="priceMax" type="number" class="form-control" placeholder="Max" min="0" value="2000000000">
              </div>
              <div class="small text-muted mt-1">Gunakan angka tanpa titik, contoh: 450000000</div>
            </div>

            <div class="mb-3">
              <label class="form-label small">Jumlah Kamar</label>
              <select id="filterRooms" class="form-select">
                <option value="">Semua</option>
                <option value="1">1+</option>
                <option value="2">2+</option>
                <option value="3">3+</option>
                <option value="4">4+</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small">Lokasi</label>
              <select id="filterLocation" class="form-select">
                <option value="">Semua Lokasi</option>
                <!-- options injected by JS -->
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small">Tipe Properti</label>
              <select id="filterType" class="form-select">
                <option value="">Semua Tipe</option>
                <option value="rumah">Rumah</option>
                <option value="villa">Villa</option>
                <option value="cluster">Cluster</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small">Status Verifikasi</label>
              <select id="filterVerified" class="form-select">
                <option value="all">Semua</option>
                <option value="verified">Terverifikasi</option>
                <option value="unverified">Belum</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small">Urutkan</label>
              <select id="sortBy" class="form-select">
                <option value="default">Rekomendasi</option>
                <option value="price_asc">Harga: Termurah → Termahal</option>
                <option value="price_desc">Harga: Termahal → Termurah</option>
                <option value="newest">Terbaru</option>
              </select>
            </div>

            <div class="d-grid gap-2">
              <button id="applyBtn" class="btn btn-primary">Terapkan Filter</button>
              <button id="resetBtn" class="btn btn-outline-secondary">Reset</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4">
    <div class="container container-wide d-flex justify-content-between small text-muted">
      <div>© 2025 Rumah Jelas</div>
      <div>Dibuat untuk tugas UI/UX — Aghni & tim</div>
    </div>
  </footer>

  <!-- jQuery & Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  /***********************
   * Sample property data
   * (Salin ke data/properties.json jika mau external)
   ***********************/
  const properties = [
    {id:1, nama:"Rumah Modern Minimalis", harga:450000000, lokasi:"Solo", kamar:3, verified:true, tipe:"rumah", img:"img/rumah1.jpg", desc:"Desain modern minimalis, lingkungan aman, 5 menit ke pusat kota.", date:"2025-06-10"},
    {id:2, nama:"Cluster Hijau Family", harga:380000000, lokasi:"Karanganyar", kamar:2, verified:false, tipe:"cluster", img:"img/rumah2.jpg", desc:"Cluster baru dekat fasilitas umum, cocok untuk keluarga kecil.", date:"2025-05-02"},
    {id:3, nama:"Vila Asri Permai", harga:1200000000, lokasi:"Sukoharjo", kamar:4, verified:true, tipe:"villa", img:"img/rumah3.jpg", desc:"Vila premium, area luas, dilengkapi taman dan garasi.", date:"2025-07-05"},
    {id:4, nama:"Rumah Cozy dekat Kampus", harga:290000000, lokasi:"Solo", kamar:2, verified:false, tipe:"rumah", img:"img/rumah4.jpg", desc:"Dekat kampus, cocok untuk mahasiswa atau investor sewa.", date:"2025-04-20"},
    {id:5, nama:"Cluster Subur Residence", harga:520000000, lokasi:"Karanganyar", kamar:3, verified:true, tipe:"cluster", img:"img/rumah5.jpg", desc:"Fasilitas lengkap: taman, playground, security 24 jam.", date:"2025-08-01"},
    {id:6, nama:"Villa Bukit Indah", harga:2400000000, lokasi:"Sukoharjo", kamar:5, verified:true, tipe:"villa", img:"img/rumah6.jpg", desc:"Vila mewah di bukit dengan view kota.", date:"2025-09-12"}
  ];

  // Utility: format rupiah
  function formatRupiah(num){ return "Rp " + Number(num).toLocaleString('id-ID'); }

  // Theme toggle (persist)
  (function(){
    const saved = localStorage.getItem('theme');
    if(saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
    $('#themeToggle').text(saved==='dark' ? 'Light' : 'Dark');
    $('#themeToggle').on('click', function(){
      const cur = document.documentElement.getAttribute('data-theme');
      if(cur === 'dark'){
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme','light');
        $(this).text('Dark');
      } else {
        document.documentElement.setAttribute('data-theme','dark');
        localStorage.setItem('theme','dark');
        $(this).text('Light');
      }
    });
  })();

  // Populate location dropdown with unique locations
  function initLocationOptions(){
    const locs = [...new Set(properties.map(p => p.lokasi))].sort();
    const $sel = $('#filterLocation');
    locs.forEach(l => $sel.append(`<option value="${l}">${l}</option>`));
  }

  // Determine featured property (pick latest verified; fallback highest price)
  function pickFeatured(list){
    let verified = list.filter(p => p.verified);
    if(verified.length){
      // pick newest verified (by date)
      verified.sort((a,b)=> new Date(b.date) - new Date(a.date));
      return verified[0];
    }
    // fallback highest price
    return list.slice().sort((a,b)=> b.harga - a.harga)[0];
  }

  // Render featured horizontal card
  function renderFeatured(p){
    if(!p) { $('#featuredContainer').html(''); return; }
    const badge = p.verified ? `<span class="badge-verified">Verified</span>` : '';
    const html = `
      <div class="left">
        <img src="${p.img}" alt="${p.nama}">
      </div>
      <div class="right">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div>
            <h4 class="mb-1">${p.nama} ${badge}</h4>
            <div class="meta">${p.lokasi} • ${p.tipe}</div>
          </div>
          <div class="text-end">
            <div class="price">${formatRupiah(p.harga)}</div>
            <div class="meta">${p.kamar} kamar</div>
          </div>
        </div>
        <p class="small text-muted mb-3">${p.desc}</p>
        <div class="mt-auto d-flex gap-2">
          <a href="detail.html?id=${p.id}" class="btn btn-primary">Lihat Detail</a>
          <button class="btn btn-outline-danger btn-wishlist" data-id="${p.id}">❤️ Wishlist</button>
        </div>
      </div>
    `;
    $('#featuredContainer').html(html);
  }

  // Render grid list
  function renderGrid(list){
    const $grid = $('#gridList');
    $grid.empty();
    if(!list || list.length === 0){
      $('#noResult').show();
      return;
    }
    $('#noResult').hide();
    list.forEach(p => {
      const badge = p.verified ? `<span class="badge-verified me-2">Verified</span>` : '';
      const card = $(`
        <div class="col-md-6 col-lg-4">
          <div class="property-card card h-100">
            <img src="${p.img}" alt="${p.nama}">
            <div class="card-body d-flex flex-column">
              <div class="d-flex justify-content-between align-items-start">
                <h6 class="mb-1">${p.nama}</h6>
                <div class="meta">${p.tipe}</div>
              </div>
              <div class="meta mb-1">${p.lokasi} • ${p.kamar} kamar</div>
              <div class="price mb-2">${formatRupiah(p.harga)}</div>
              <p class="small text-muted mb-3">${p.desc}</p>
              <div class="mt-auto d-flex gap-2">
                <a href="detail.html?id=${p.id}" class="btn btn-sm btn-primary">Detail</a>
                <button class="btn btn-sm btn-outline-danger btn-wishlist" data-id="${p.id}">❤️ Wishlist</button>
              </div>
            </div>
          </div>
        </div>
      `);
      $grid.append(card);
    });
  }

  // Apply filters based on UI controls
  function applyFiltersAndRender(){
    const q = ($('#searchInput').val()||'').trim().toLowerCase();
    const min = Number($('#priceMin').val()||0);
    const max = Number($('#priceMax').val()||Number.MAX_SAFE_INTEGER);
    const rooms = $('#filterRooms').val();
    const loc = $('#filterLocation').val();
    const type = $('#filterType').val();
    const verifiedSel = $('#filterVerified').val();
    const sortBy = $('#sortBy').val();

    let filtered = properties.filter(p => {
      // search by name or location
      const text = (p.nama + ' ' + p.lokasi).toLowerCase();
      if(q && !text.includes(q)) return false;
      if(p.harga < min || p.harga > max) return false;
      if(rooms && p.kamar < Number(rooms)) return false;
      if(loc && p.lokasi !== loc) return false;
      if(type && p.tipe !== type) return false;
      if(verifiedSel !== 'all'){
        if(verifiedSel === 'verified' && !p.verified) return false;
        if(verifiedSel === 'unverified' && p.verified) return false;
      }
      return true;
    });

    // sorting
    if(sortBy === 'price_asc') filtered.sort((a,b)=> a.harga - b.harga);
    else if(sortBy === 'price_desc') filtered.sort((a,b)=> b.harga - a.harga);
    else if(sortBy === 'newest') filtered.sort((a,b)=> new Date(b.date) - new Date(a.date));

    // render featured: pick from filtered if possible, else global fallback
    let featured = pickFeatured(filtered.length ? filtered : properties);
    renderFeatured(featured);

    // in grid exclude the featured property (avoid duplicate)
    const gridList = filtered.filter(p => p.id !== (featured ? featured.id : -1));
    renderGrid(gridList);
  }

  // Wishlist handling (localStorage)
  function initWishlistButtons(){
    $(document).on('click', '.btn-wishlist', function(){
      const id = Number($(this).data('id'));
      let wishlist = JSON.parse(localStorage.getItem('wishlist')||'[]');
      if(!wishlist.includes(id)) wishlist.push(id);
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
      $(this).text('✔ Disimpan');
      setTimeout(()=> $(this).html('❤️ Wishlist'), 1200);
    });
  }

  // init events
  $(function(){
    initLocationOptions();
    // default render
    applyFiltersAndRender();
    initWishlistButtons();

    // controls
    $('#applyBtn').on('click', applyFiltersAndRender);
    $('#resetBtn').on('click', function(){
      $('#searchInput').val('');
      $('#priceMin').val(0);
      $('#priceMax').val(2000000000);
      $('#filterRooms').val('');
      $('#filterLocation').val('');
      $('#filterType').val('');
      $('#filterVerified').val('all');
      $('#sortBy').val('default');
      applyFiltersAndRender();
    });

    // convenience: live search on Enter
    $('#searchInput').on('keyup', function(e){ if(e.key === 'Enter') applyFiltersAndRender(); });

    // numbers: keep min <= max
    $('#priceMin, #priceMax').on('change', function(){
      let min = Number($('#priceMin').val()||0);
      let max = Number($('#priceMax').val()||0);
      if(min > max){ // swap if wrong
        [min,max] = [max,min];
        $('#priceMin').val(min); $('#priceMax').val(max);
      }
    });
  });
  </script>
</body>
</html>
